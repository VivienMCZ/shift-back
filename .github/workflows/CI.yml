name: CI

on:
  push:
    branches:
      - "develop"
      - "main"
  pull_request:
    branches:
      - "develop"
      - "main"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.13"

jobs:
  ci:
    name: Tests, qualité et sécurité
    runs-on: ubuntu-latest

    steps:
      # ---------------------------------------------------------------- #
      # Préparation
      # ---------------------------------------------------------------- #
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # Sonar a besoin de l'historique complet pour attribuer la dette
          # technique aux bons commits (blame).
          fetch-depth: 0

      - name: Check for sensitive files
        run: |
          if [ -f .env ]; then
            echo "❌ ERROR: .env file detected in the repository! You should never push this file."
            exit 1
          fi

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # ---------------------------------------------------------------- #
      # Tests
      #
      # Les tests forcent DATABASE_URL vers un SQLite jetable
      # (tests/conftest.py) : aucun secret de base de données n'est exposé
      # à ce workflow, c'est délibéré.
      # ---------------------------------------------------------------- #
      - name: Tests et couverture
        run: |
          pytest -v \
            --junitxml=pytest-report.xml \
            --cov --cov-report=xml --cov-report=term

      - name: Upload des rapports de test
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rapports-tests
          path: |
            pytest-report.xml
            coverage.xml

      # ---------------------------------------------------------------- #
      # Scan de sécurité des dépendances
      # ---------------------------------------------------------------- #
      # Échoue si une dépendance d'exécution porte une vulnérabilité connue
      # (base PyPI Advisory + OSV).
      - name: Audit des dépendances d'exécution
        run: pip-audit --requirement requirements.txt --strict --progress-spinner=off

      - name: Audit des dépendances de développement
        run: pip-audit --requirement requirements-dev.txt --progress-spinner=off
        continue-on-error: true

      - name: Rapport pip-audit
        if: always()
        run: |
          pip-audit --requirement requirements.txt \
            --format json --output pip-audit.json --progress-spinner=off || true

      - name: Upload du rapport pip-audit
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rapport-pip-audit
          path: pip-audit.json

      # ---------------------------------------------------------------- #
      # Analyse statique SonarQube
      #
      # Ignorée tant que le secret SONAR_TOKEN n'est pas configuré, afin de
      # ne pas bloquer un dépôt fraîchement cloné ni une PR issue d'un fork.
      #
      # Ignorée aussi sur les push de branche autres que main : le plan
      # gratuit de SonarQube Cloud n'analyse que la branche principale et les
      # pull requests. Sur un push vers develop, le rapport s'uploade puis la
      # lecture du quality gate échoue en « Not authorized or project not
      # found », ce qui fait échouer la CI sans rien apporter. Aucune
      # couverture n'est perdue : la PR develop -> main analyse les mêmes
      # commits, quality gate bloquant inclus.
      # ---------------------------------------------------------------- #
      - name: Vérification de la configuration Sonar
        id: sonar_config
        if: always()
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_REF_ANALYSABLE: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/main' }}
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "⚠️  SONAR_TOKEN absent : analyse SonarQube ignorée."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          elif [ "$SONAR_REF_ANALYSABLE" != "true" ]; then
            echo "ℹ️  Push hors main : analyse SonarQube ignorée (plan gratuit = main + PR)."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      # SonarQube Cloud par défaut. Pour une instance auto-hébergée, définir la
      # variable de dépôt SONAR_HOST_URL (Settings > Variables > Actions).
      - name: Analyse SonarQube
        if: steps.sonar_config.outputs.configured == 'true'
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL || 'https://sonarcloud.io' }}

      # ---------------------------------------------------------------- #
      # Image Docker
      # ---------------------------------------------------------------- #
      - name: Build de l'image
        run: docker build -t shift-back:ci .

      - name: Smoke test de l'image
        run: |
          docker run --rm --entrypoint python shift-back:ci \
            -c "import fastapi, sqlalchemy, jwt, httpx; print('imports OK')"

      # Scan des paquets de l'image à la recherche de CVE connues.
      #
      # Bloquant, mais uniquement sur les vulnérabilités HIGH/CRITICAL pour
      # lesquelles un correctif existe (``ignore-unfixed: true``). Une CVE de
      # l'image de base amont sans correctif disponible ne peut pas être réglée
      # côté projet : la rendre bloquante immobiliserait la CI sur un problème
      # qu'on ne peut pas résoudre. Dès qu'un correctif paraît, le build échoue
      # tant que l'image n'est pas reconstruite dessus — c'est le comportement
      # voulu. Dependabot met à jour l'image de base pour fournir ce correctif.
      - name: Scan Trivy de l'image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: shift-back:ci
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          # Exceptions justifiées (findings d'outillage sur des couches de base,
          # pas les dépendances de l'app). Voir les commentaires du fichier.
          trivyignores: .trivyignore

      # ---------------------------------------------------------------- #
      # Test d'intégration de la pile assemblée (db + api en conteneurs)
      #
      # La suite pytest tourne sur SQLite/TestClient : elle ne prouve pas que
      # l'assemblage réel démarre et répond. Ce job démarre les vrais conteneurs
      # et vérifie de bout en bout le service, la base, le géocodage et les
      # durcissements de sécurité clés. Un .env de test est généré par le script
      # (aucun secret réel n'est requis ni exposé au workflow).
      # ---------------------------------------------------------------- #
      - name: Test d'intégration Docker Compose
        run: bash tests/integration/stack_smoke.sh

  # ------------------------------------------------------------------------ #
  # Chaîne d'approvisionnement : secrets et qualité du Dockerfile (A05/A08)
  # ------------------------------------------------------------------------ #
  supply_chain:
    name: Secrets et Dockerfile
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # gitleaks scanne l'historique : il lui faut plus que le dernier commit.
          fetch-depth: 0

      # Détecte une clé, un jeton ou un mot de passe commité par erreur, dans le
      # dépôt comme dans l'historique.
      - name: Scan des secrets (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Lint du Dockerfile : utilisateur non-root, versions épinglées, couches
      # inutiles. Bloquant à partir du niveau error.
      - name: Lint du Dockerfile (hadolint)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          failure-threshold: error

  # ------------------------------------------------------------------------ #
  # Analyse statique de sécurité du code Python (SAST)
  #
  # Symétrique de CodeQL déjà présent côté front. Repère les motifs à risque
  # (injection, désérialisation, secrets en dur) dans app/.
  # ------------------------------------------------------------------------ #
  codeql:
    name: CodeQL (SAST)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Initialisation CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: python
          queries: security-extended

      - name: Analyse CodeQL
        uses: github/codeql-action/analyze@v3
