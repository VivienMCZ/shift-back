# Configuration SonarQube (Cloud ou Server).
#
# Les deux clés ci-dessous suivent la convention appliquée par SonarQube Cloud
# lors de l'import d'un dépôt GitHub : organisation = compte GitHub en
# minuscules, projectKey = <compte GitHub>_<nom du dépôt>.
# À vérifier après création du projet dans « Administration > Update Key » ;
# la valeur exacte est aussi affichée à l'écran d'import.
#
# Seul le secret GitHub SONAR_TOKEN reste à créer à la main :
#   SonarQube Cloud > My Account > Security > Generate Token.
#
# Pour un SonarQube auto-hébergé, ajouter aussi le secret SONAR_HOST_URL et
# décommenter la ligne correspondante dans .github/workflows/CI.yml.

sonar.projectKey=VivienMCZ_shift-back
sonar.organization=vivienmcz
sonar.projectName=Shift API
sonar.projectVersion=1.0.0

# Périmètre analysé
sonar.sources=app
sonar.tests=tests
sonar.sourceEncoding=UTF-8

# Le scanner attend le verdict du quality gate et échoue s'il n'est pas
# respecté. Commenter cette ligne pour rendre l'analyse non bloquante.
sonar.qualitygate.wait=true

# Python
sonar.python.version=3.13
sonar.python.coverage.reportPaths=coverage.xml
sonar.python.xunit.reportPath=pytest-report.xml

# Exclusions
# Les fichiers de seed sont de longues listes de données, pas de la logique :
# les analyser gonfle artificiellement la dette et la duplication.
sonar.exclusions=**/__pycache__/**,**/.venv/**,app/seed.py
sonar.coverage.exclusions=tests/**,app/seed.py
sonar.cpd.exclusions=app/seed.py
